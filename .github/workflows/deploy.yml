name: Deploy Next.js to Server

on:
  push:
    branches:
      - main

concurrency:
  group: nextjs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ssh.abyandimas.me >> ~/.ssh/known_hosts

      - name: Deploy Next.js application
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ProxyCommand="cloudflared access ssh --hostname %h --access-client-id ${CF_ACCESS_CLIENT_ID} --access-client-secret ${CF_ACCESS_CLIENT_SECRET}" \
            client@ssh.abyandimas.me << 'EOF'
              set -e
              
              echo "Connected to server"
              hostname
              
              echo "Enter application directory"
              cd ~/lkpbinarkomputer
              
              echo "Fetch latest code"
              git fetch origin main
              
              echo "Force sync with remote branch"
              git reset --hard origin/main
              
              echo "Install dependencies"
              npm install --force
              
              echo "Build Next.js application"
              npm run build
              
              echo "Build completed successfully"
              
              echo "Check PM2 status (before)"
              pm2 status || true
              
              if pm2 list | grep -q next-lkpbinar; then
                echo "Restart existing PM2 process"
                pm2 restart next-lkpbinar
              else
                echo "Start PM2 process for the first time"
                pm2 start npm --name "next-lkpbinar" -- start
              fi
              
              echo "Save PM2 process list"
              pm2 save
              
              echo "Check PM2 status (after)"
              pm2 status
          EOF
