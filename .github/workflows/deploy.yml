name: Deploy via Cloudflare Access SSH

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CF_SERVICE_TOKEN_ID: ${{ secrets.CF_SERVICE_TOKEN_ID }}
          CF_SERVICE_TOKEN_SECRET: ${{ secrets.CF_SERVICE_TOKEN_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat <<EOF > ~/.ssh/config
          Host ubuntu
            HostName ssh1.abyandimas.me
            User clinet
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh \
              --hostname %h \
              --service-token-id ${CF_SERVICE_TOKEN_ID} \
              --service-token-secret ${CF_SERVICE_TOKEN_SECRET}
            StrictHostKeyChecking no
            ServerAliveInterval 30
          EOF

      - name: Deploy application
        run: |
          ssh -T ubuntu << 'EOF'
            set -e

            echo "Connected to server"
            hostname

            cd ~/lkpbinarkomputer

            git fetch origin main
            git reset --hard origin/main

            npm install --force
            npm run build

            pm2 status || true

            if pm2 list | grep -q next-lkpbinar; then
              pm2 restart next-lkpbinar
            else
              pm2 start npm --name next-lkpbinar -- start
            fi

            pm2 save
            pm2 status
          EOF
