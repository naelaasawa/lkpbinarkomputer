name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CF_SERVICE_TOKEN_ID: ${{ secrets.CF_SERVICE_TOKEN_ID }}
          CF_SERVICE_TOKEN_SECRET: ${{ secrets.CF_SERVICE_TOKEN_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host ubuntu
            HostName ssh1.abyandimas.me
            User clinet
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${CF_SERVICE_TOKEN_ID} --service-token-secret ${CF_SERVICE_TOKEN_SECRET}
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - run: ssh -T ubuntu "echo ok"

  prisma:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CF_SERVICE_TOKEN_ID: ${{ secrets.CF_SERVICE_TOKEN_ID }}
          CF_SERVICE_TOKEN_SECRET: ${{ secrets.CF_SERVICE_TOKEN_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host ubuntu
            HostName ssh1.abyandimas.me
            User clinet
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${CF_SERVICE_TOKEN_ID} --service-token-secret ${CF_SERVICE_TOKEN_SECRET}
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - run: |
          ssh -T ubuntu << 'EOF'
            set -e
            cd ~/lkpbinarkomputer
            npm install --force
            npx prisma db pull
            npx prisma generate
          EOF

  build:
    needs: prisma
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CF_SERVICE_TOKEN_ID: ${{ secrets.CF_SERVICE_TOKEN_ID }}
          CF_SERVICE_TOKEN_SECRET: ${{ secrets.CF_SERVICE_TOKEN_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host ubuntu
            HostName ssh1.abyandimas.me
            User clinet
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${CF_SERVICE_TOKEN_ID} --service-token-secret ${CF_SERVICE_TOKEN_SECRET}
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - run: |
          ssh -T ubuntu << 'EOF'
            set -e
            cd ~/lkpbinarkomputer
            git fetch origin main
            git reset --hard origin/main
            npm i --force
            npm run build
          EOF

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CF_SERVICE_TOKEN_ID: ${{ secrets.CF_SERVICE_TOKEN_ID }}
          CF_SERVICE_TOKEN_SECRET: ${{ secrets.CF_SERVICE_TOKEN_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host ubuntu
            HostName ssh1.abyandimas.me
            User clinet
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${CF_SERVICE_TOKEN_ID} --service-token-secret ${CF_SERVICE_TOKEN_SECRET}
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - run: |
          ssh -T ubuntu << 'EOF'
            set -e
            cd ~/lkpbinarkomputer
            if pm2 list | grep -q next-lkpbinar; then
              pm2 restart next-lkpbinar
            else
              pm2 start npm --name next-lkpbinar -- start
            fi
            pm2 save
          EOF
